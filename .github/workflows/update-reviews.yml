name: Update Reviews

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC (06:00 em Brasília), todos os dias
  workflow_dispatch:     # permite rodar manualmente pela aba Actions
  push:                  # roda ao cadastrar cliente ou mudar o script
    branches: [main]
    paths:
      - 'clients/*/config.json'
      - 'scripts/**'
      - '.github/workflows/update-reviews.yml'

permissions:
  contents: write        # necessário para o commit automático

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update-reviews:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update reviews
        run: node scripts/update-reviews.js
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      # roda mesmo se um cliente falhar, para salvar os que deram certo
      - name: Commit and push changes
        if: always()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add clients/*/reviews.json clients/*/config.json
          git diff --staged --quiet || (git commit -m "chore: update reviews" && git push)
